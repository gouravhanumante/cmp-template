#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#App identity (read by androidApp/build.gradle.kts)
app.name=Template
app.applicationId=com.boundless.template

# Backend per build variant (-> BuildConfig.API_BASE_URL). Must end with a slash.
# Blank = core:network's defaultApiBaseUrl() (emulator/simulator loopback). -PapiBaseUrl=... overrides both.
app.apiBaseUrl.prod=
app.apiBaseUrl.debug=
