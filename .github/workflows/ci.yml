name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile all JVM-side targets and run tests
        run: >
          ./gradlew --console=plain
          :androidApp:compileDebugKotlin testAndroidHostTest testDebugUnitTest jvmTest
          :desktopApp:compileKotlin :webApp:compileKotlinWasmJs
